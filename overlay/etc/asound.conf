# The phone's sound card (chiron-wcd9335). The speaker path (QUAT MI2S ->
# TAS2559) only takes 48 kHz, stereo, S16_LE: plug converts to that. Playback
# goes through the software volume "Master", which the volume keys change
# (mix2-volume; udev creates the control at a quiet level before first use).
pcm.!default {
	type plug
	slave {
		pcm "mix2_softvol"
		format S16_LE
		rate 48000
		channels 2
	}
}

pcm.mix2_softvol {
	type softvol
	slave.pcm "hw:chironwcd9335,0"
	control {
		name "Master"
		card chironwcd9335
	}
	min_dB -51.0
	max_dB 0.0
}

ctl.!default {
	type hw
	card chironwcd9335
}
