# The phone's sound card (chiron-wcd9335).
#
# Playback: the speaker path (QUAT MI2S -> TAS2559) only takes 48 kHz, stereo,
# S16_LE: plug converts to that. It goes through the software volume "Master",
# which the volume keys change (mix2-volume), and dmix. dmix keeps the DSP
# stream running while the player flushes and refills (seeking): restarted
# directly with less than one 1920-frame period queued, it ran into an
# underrun at once and VLC stayed silent after every seek. It also lets more
# than one program play at a time.
#
# Capture: the main microphone (AMIC3, routed by mix2-audio-init) on the second
# stream MultiMedia2, so recording works while something plays. One SLIMbus
# channel: 48 kHz mono S16_LE, converted by plug. "Mic Boost" adds digital gain
# (-10..+30 dB, default +15 dB).
#
# mix2-volume creates both controls before first use: softvol would create
# them at their maximum.
pcm.!default {
	type asym
	playback.pcm "mix2_playback"
	capture.pcm "mix2_capture"
}

pcm.mix2_playback {
	type plug
	slave {
		pcm "mix2_softvol"
		format S16_LE
		rate 48000
		channels 2
	}
}

pcm.mix2_softvol {
	type softvol
	slave.pcm "mix2_dmix"
	control {
		name "Master"
		card chironwcd9335
	}
	min_dB -51.0
	max_dB 0.0
}

pcm.mix2_dmix {
	type dmix
	ipc_key 4242
	ipc_perm 0666
	slave {
		pcm "hw:chironwcd9335,0"
		format S16_LE
		rate 48000
		channels 2
		period_size 1920
		buffer_size 7680
	}
}

pcm.mix2_capture {
	type plug
	slave {
		pcm "mix2_micboost"
		format S16_LE
		rate 48000
		channels 1
	}
}

pcm.mix2_micboost {
	type softvol
	slave.pcm "hw:chironwcd9335,1"
	control {
		name "Mic Boost"
		card chironwcd9335
		count 1
	}
	min_dB -10.0
	max_dB 30.0
	resolution 41
}

ctl.!default {
	type hw
	card chironwcd9335
}
