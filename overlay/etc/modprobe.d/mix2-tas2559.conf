# TAS2559/TAS2560 speaker amplifiers (kernel/tas2559): the controlled playback
# component, at the stock gains (speaker 15, earpiece 11), without the
# bring-up time limit and allowing repeated opens. Each prepare reprograms
# and re-checks the amplifiers; faults stop them.
options snd_soc_tas2559 controlled_playback=1 gain=15 earpiece_gain=11 play_limit_ms=0 reopen=1
