# Leave evidence of hangs in ramoops (/var/lib/systemd/pstore after the
# next boot) and come back by itself instead of staying frozen.
# Every message reaches the consoles, ramoops included (X hides tty0).
kernel.printk = 8 4 1 7
# A CPU stuck with interrupts off took the whole phone down (hard LOCKUP on
# cpu 7); panic instead, and reboot 10 s later (a warm reset, see mix2-pon)
kernel.hardlockup_panic = 1
kernel.softlockup_panic = 1
kernel.hardlockup_all_cpu_backtrace = 1
kernel.softlockup_all_cpu_backtrace = 1
kernel.panic = 10
